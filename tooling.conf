#
#  tooling.conf
#  model-formats
#
#  Copyright 2010-2026 Saxon Herschel Nicholls
#
#  The settings tooling's scripts read (third_party/tooling, README "tooling.conf"). model-formats runs its own
#  check_mirror and check_version; it takes tooling's single include, snicholls_formats.hpp (generated, never
#  committed), with the libraries it pins expanded too so that it needs only the standard library.

name          = model-formats
include_root  = include/snicholls/formats
namespace     = snicholls::formats
umbrella      = formats.hpp

single_include.snicholls_formats = snicholls/formats/formats.hpp   # every header that needs no third party
single_include_inline = include third_party/core/include third_party/ts-moveables/TSMoveables third_party/core-adapters/include

# Opted out (one line, as tooling.conf keys appear once), each because it needs a third party:
#   detail/json.hpp and everything that parses JSON through it - hf/config.hpp, hf/tokenizer.hpp, safetensors/index.hpp,
#   safetensors/safetensors.hpp, convert/convert.hpp, convert/export.hpp, io/files.hpp, io/model_dir.hpp,
#   hub/cache.hpp: nlohmann/json, through core-adapters' snicholls::core_json;
#   hub/digest.hpp (OpenSSL's EVP SHA-256) and hub/client.hpp (OpenSSL TLS, through ts-moveables): OpenSSL as well.
single_include_opt_in = detail/json.hpp hf/config.hpp hf/tokenizer.hpp safetensors/index.hpp safetensors/safetensors.hpp convert/convert.hpp convert/export.hpp io/files.hpp io/model_dir.hpp hub/cache.hpp hub/digest.hpp hub/client.hpp   # nlohmann/json; hub/digest and hub/client also OpenSSL
