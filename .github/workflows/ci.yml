name: CI

# The same gate as a local run: Linux under GCC and Clang and macOS with Apple Clang, each a Release build with warnings
# as errors (benchmarks smoke-run) and a Debug build with asserts live; the documentation built with warnings as errors
# and published to GitHub Pages from main and from each release tag. The tests that reach huggingface.co (label
# network) are off here, as they are by default locally. Every leg blocks.
#
# Submodules come through scripts/bootstrap.sh, not `submodules: recursive`: it checks out only what the build needs
# and keeps the build at one core version (CLAUDE.md "One core version").

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 GCC
            os: ubuntu-24.04
            cxx: g++
          - name: Linux x86-64 Clang
            os: ubuntu-24.04
            cxx: clang++
          - name: macOS ARM64 Apple Clang
            os: macos-latest
            cxx: c++
    steps:
      - uses: actions/checkout@v5

      - name: Submodules
        run: scripts/bootstrap.sh

      - name: Build tools and OpenSSL
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build libssl-dev zlib1g-dev
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            brew install ninja openssl@3
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          fi

      - name: Static checks
        run: |
          python3 scripts/check_version.py
          python3 scripts/check_mirror.py

      - name: Release, warnings as errors
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DMODEL_FORMATS_WERROR=ON -DMODEL_FORMATS_BUILD_BENCHMARKS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure -LE network

      - name: Debug, asserts live
        run: |
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DMODEL_FORMATS_WERROR=ON
          cmake --build build-debug
          ctest --test-dir build-debug --output-on-failure -LE network

  docs:
    name: Documentation (warnings are errors)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to publish to the gh-pages branch
    concurrency:
      group: pages           # main and a tag pushed together must not race on gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Submodules
        run: scripts/bootstrap.sh

      - name: Install Doxygen and OpenSSL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen libssl-dev zlib1g-dev

      - name: Configure
        run: cmake -B build -DMODEL_FORMATS_BUILD_TESTS=OFF -DMODEL_FORMATS_BUILD_TOOLS=OFF -DMODEL_FORMATS_BUILD_DOCS=ON

      - name: Build the documentation
        run: cmake --build build --target docs

      # gh-pages holds generated HTML only, one folder per version; never edit it by hand.
      - name: Publish to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DEST: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          trap 'git worktree remove --force "$site" 2>/dev/null || true' EXIT
          git branch -D gh-pages 2>/dev/null || true
          if git fetch --depth 1 origin gh-pages 2>/dev/null; then
            git worktree add "$site" FETCH_HEAD
            git -C "$site" switch -C gh-pages
          else
            git worktree add --detach "$site"
            git -C "$site" switch --orphan gh-pages
          fi
          rm -rf "${site:?}/$DEST" && mkdir -p "$site/$DEST" && cp -R build/docs/html/. "$site/$DEST/"
          touch "$site/.nojekyll"
          latest=$(cd "$site" && ls -d v*/ 2>/dev/null | tr -d / | sort -V | tail -1 || true)
          target=${latest:-main}
          printf '<!DOCTYPE html>\n<meta charset="utf-8">\n<title>model-formats</title>\n<meta http-equiv="refresh" content="0; url=%s/">\n<p>The documentation for <a href="%s/">model-formats %s</a>; every version: %s</p>\n' \
            "$target" "$target" "$target" "$(cd "$site" && ls -d main v*/ 2>/dev/null | tr -d / | sort -V | sed 's|.*|<a href="&/">&</a>|' | paste -sd ' ' -)" > "$site/index.html"
          git -C "$site" add -A
          if git -C "$site" diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git -C "$site" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "docs: $DEST ($GITHUB_SHA)"
          git -C "$site" push origin gh-pages
